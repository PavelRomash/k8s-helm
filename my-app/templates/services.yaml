apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nginx
spec:
  selector:
    app: {{ .Release.Name }}-nginx
  ports:
    - name: http
      port: {{ .Values.nginx.service.port }}
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-multitool
spec:
  selector:
    app: {{ .Release.Name }}-multitool
  ports:
    - name: http
      port: {{ .Values.multitool.service.port }}
      targetPort: {{ .Values.multitool.httpPort }}
